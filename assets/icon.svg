<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- «Курсор-комета»: нарисована в Inkscape (assets/icon-cursor.svg), здесь — чистая копия без служебных данных редактора -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a3d"/>
      <stop offset=".5" stop-color="#e2338f"/>
      <stop offset="1" stop-color="#6a3cff"/>
    </linearGradient>
    <linearGradient id="trail1" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="trail2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="trail3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9fd8ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#9fd8ff" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="cursor" x1="250.97731" y1="60.506091" x2="250.97731" y2="376.03415" gradientTransform="scale(0.80246313,1.2461632)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1e9ff"/>
    </linearGradient>
    <filter id="shadow" x="-0.21" y="-0.12" width="1.44" height="1.29" style="color-interpolation-filters:sRGB">
      <feFlood flood-opacity="0.5" flood-color="rgb(43,10,92)" result="flood"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feOffset in="blur" dx="4" dy="14" result="offset"/>
      <feComposite in="flood" in2="offset" operator="in" result="comp1"/>
      <feComposite in="SourceGraphic" in2="comp1" operator="over"/>
    </filter>
    <filter id="glow" x="-0.9" y="-1.4" width="2.8" height="3.7" style="color-interpolation-filters:sRGB">
      <feGaussianBlur stdDeviation="124.8"/>
    </filter>
    <clipPath id="iconclip"><rect x="20" y="20" width="472" height="472" rx="128"/></clipPath>
  </defs>
  <rect class="sq" x="20" y="20" width="472" height="472" rx="128" fill="url(#bg)"/>
  <g clip-path="url(#iconclip)">
    <ellipse cx="215.4" cy="151.5" rx="169.9" ry="113.4" fill="#fff" opacity=".16" filter="url(#glow)"/>
  </g>
  <g class="trails">
    <path class="trail t1" d="M92 236 L262 174" stroke="url(#trail2)" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path class="trail t2" d="M70 330 L292 262" stroke="url(#trail1)" stroke-width="30" stroke-linecap="round" fill="none"/>
    <path class="trail t3" d="M128 410 L300 290" stroke="url(#trail3)" stroke-width="22" stroke-linecap="round" fill="none"/>
  </g>
  <g class="arrow">
    <path d="m 250,112 164,188 -82,6 48,90 -42,22 -46,-92 -54,58 z" fill="url(#cursor)" stroke="#2b1a5c" stroke-opacity="0.18" stroke-width="6" stroke-linejoin="round" filter="url(#shadow)" transform="matrix(0.28729692,0.7893418,-0.7893418,0.28729692,432.46762,-59.048619)"/>
  </g>
</svg>
