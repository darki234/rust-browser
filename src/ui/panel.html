<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Панель</title>
<style>
  :root {
    color-scheme: light;
    --frame: #dfe2eb; --surface: #ffffff; --surface-2: #f6f7fb; --text: #1b1c22; --muted: #697084;
    --border: rgba(20, 24, 48, .09); --hover: rgba(20, 24, 48, .06); --press: rgba(20, 24, 48, .11);
    --accent: #4f5bf5; --on-accent: #fff;
    --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --frame: #18191f; --surface: #23242c; --surface-2: #1b1c22; --text: #eceef5; --muted: #9a9fb1;
    --border: rgba(255, 255, 255, .08); --hover: rgba(255, 255, 255, .075); --press: rgba(255, 255, 255, .13);
    --accent: #8288ff; --on-accent: #10111a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--frame); color: var(--text);
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    user-select: none; border-left: 1px solid var(--border);
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  svg { display: block; }

  header { flex: none; height: 44px; display: flex; align-items: center; gap: 2px; padding-left: 8px; position: relative; }
  .rz { position: absolute; top: 0; left: 0; right: 0; height: 5px; cursor: n-resize; z-index: 2; }
  body.maximized .rz { display: none; }
  .apps { display: flex; gap: 2px; position: relative; }
  .app {
    width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px;
    color: var(--muted); transition: background .15s, color .15s, transform .12s var(--ease);
  }
  .app:hover { background: var(--hover); color: var(--text); }
  .app:active { transform: scale(.9); }
  .app.on { color: var(--accent); background: var(--press); }
  .drag { flex: 1; align-self: stretch; }
  .win { display: flex; align-self: stretch; }
  .win button { width: 42px; display: grid; place-items: center; transition: background .12s; }
  .win button:hover { background: var(--hover); }
  .win .close:hover { background: #c42b1c; color: #fff; }
  .hide { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); margin-right: 2px; }
  .hide:hover { background: var(--hover); color: var(--text); }

  main { flex: 1; min-height: 0; position: relative; }
  section { position: absolute; inset: 0; display: none; flex-direction: column; padding: 4px 12px 12px; animation: in .25s var(--ease); }
  section.on { display: flex; }
  @keyframes in { from { opacity: 0; transform: translateX(10px); } }
  h2 { margin: 6px 4px 10px; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
  h2 small { font-size: 11.5px; font-weight: 400; color: var(--muted); }

  /* заметки */
  textarea {
    flex: 1; width: 100%; resize: none; padding: 14px 16px; border-radius: 14px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font: 14px/1.6 "Segoe UI Variable Text", "Segoe UI", sans-serif; outline: none; user-select: text;
    transition: border-color .2s, box-shadow .2s;
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }

  /* калькулятор */
  .display {
    padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border);
    text-align: right; overflow: hidden;
  }
  .expr { min-height: 18px; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .value { font: 300 36px/1.2 "Segoe UI Variable Display", "Segoe UI", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: text; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .key {
    height: 52px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border);
    font-size: 18px; transition: background .12s, transform .1s var(--spring);
  }
  .key:hover { background: var(--hover); }
  .key:active { transform: scale(.94); }
  .key.op { color: var(--accent); font-weight: 600; }
  .key.eq { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .key.wide { grid-column: span 2; }
  .history { flex: 1; min-height: 0; overflow-y: auto; margin-top: 12px; }
  .history div { padding: 6px 8px; border-radius: 8px; text-align: right; color: var(--muted); cursor: pointer; user-select: text; }
  .history div:hover { background: var(--hover); color: var(--text); }
  .history b { color: var(--text); font-weight: 500; }

  /* мессенджеры живут в отдельном окне поверх этого места */
  .hint { margin: auto; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="rz" data-dir="n"></div>
  <div class="apps">
    <button class="app" data-app="notes" title="Заметки">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M15 3v5h5"/><path d="M8 13h8M8 17h5"/></svg>
    </button>
    <button class="app" data-app="calc" title="Калькулятор">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2.5" width="16" height="19" rx="2.5"/><path d="M8 7h8"/><path d="M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01" stroke-width="2.8"/></svg>
    </button>
    <button class="app" data-app="telegram" title="Telegram">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.5 3.5-19 7.3 6 2.2 2.3 7 3.4-4.4 5 3.7z"/><path d="m8.5 13 9.5-7"/></svg>
    </button>
    <button class="app" data-app="whatsapp" title="WhatsApp">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5 5 16a8.5 8.5 0 1 1 3.3 3.1z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-2.3-2.3l.8-1-1-2z"/></svg>
    </button>
  </div>
  <div class="drag"></div>
  <button class="hide" title="Скрыть панель (Ctrl+Shift+E)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/><path d="m8 10 2 2-2 2"/></svg>
  </button>
  <div class="win">
    <button class="min" title="Свернуть"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M5 12h14"/></svg></button>
    <button class="max" title="Развернуть"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="5.5" y="5.5" width="13" height="13" rx="2"/></svg></button>
    <button class="close" title="Закрыть"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </div>
</header>

<main>
  <section id="notes">
    <h2>Заметки <small id="saved"></small></h2>
    <textarea id="text" spellcheck="true" placeholder="Записывайте сюда что угодно — сохраняется само"></textarea>
  </section>

  <section id="calc">
    <h2>Калькулятор</h2>
    <div class="display"><div class="expr" id="expr"></div><div class="value" id="value">0</div></div>
    <div class="keys" id="keys"></div>
    <div class="history" id="history"></div>
  </section>

  <section id="telegram"><div class="hint">Загрузка Telegram…</div></section>
  <section id="whatsapp"><div class="hint">Загрузка WhatsApp…</div></section>
</main>

<script>
'use strict';
const send = (cmd, data = {}) => window.ipc.postMessage(JSON.stringify({ cmd, ...data }));
const $ = (s) => document.querySelector(s);
let state = { app: 'notes', notes: '', dark: false, accent: '', maximized: false };

// ----- переключение приложений -----
for (const button of document.querySelectorAll('.app')) {
  button.addEventListener('click', () => send('app', { id: button.dataset.app }));
}
$('.hide').addEventListener('click', () => send('close'));
$('.min').addEventListener('click', () => send('minimize'));
$('.max').addEventListener('click', () => send('maximize'));
$('.close').addEventListener('click', () => send('quit'));
$('.drag').addEventListener('mousedown', (e) => { if (e.button === 0) send(e.detail === 2 ? 'maximize' : 'drag'); });
$('.rz').addEventListener('mousedown', (e) => { if (e.button === 0) send('resize', { dir: 'n' }); });

function setState(next) {
  const appChanged = next.app !== state.app;
  state = { ...state, ...next };
  document.documentElement.dataset.theme = state.dark ? 'dark' : 'light';
  document.body.classList.toggle('maximized', !!state.maximized);
  if (state.accent) document.documentElement.style.setProperty('--accent', state.accent);
  else document.documentElement.style.removeProperty('--accent');
  for (const b of document.querySelectorAll('.app')) b.classList.toggle('on', b.dataset.app === state.app);
  for (const s of document.querySelectorAll('section')) s.classList.toggle('on', s.id === state.app);
  if (document.activeElement !== text) text.value = state.notes;
  if (appChanged && state.app === 'notes') text.focus();
}

// ----- заметки: сохраняются сами через полсекунды после последней правки -----
const text = $('#text');
let saveTimer = 0;
text.addEventListener('input', () => {
  $('#saved').textContent = 'сохраняю…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    send('notes', { text: text.value });
    $('#saved').textContent = 'сохранено';
  }, 500);
});

// ----- калькулятор: свой разбор выражений, без eval -----
function evaluate(src) {
  // только цифры, скобки и знаки действий — любой другой символ означает ошибку
  if (!/^[\d\s.,+\-*/%()×÷]*$/.test(src)) throw 0;
  const tokens = src.replace(/×/g, '*').replace(/÷/g, '/').replace(/,/g, '.').match(/\d+(?:\.\d+)?|[-+*/%()]/g) || [];
  let i = 0;
  const peek = () => tokens[i];
  const next = () => tokens[i++];
  function primary() {
    const t = next();
    if (t === '-') return -primary();
    if (t === '(') { const v = sum(); if (next() !== ')') throw 0; return v; }
    if (t === undefined || !/^\d/.test(t)) throw 0;
    let v = parseFloat(t);
    while (peek() === '%') { next(); v /= 100; }
    return v;
  }
  function product() {
    let v = primary();
    while (peek() === '*' || peek() === '/') {
      const op = next(), r = primary();
      v = op === '*' ? v * r : v / r;
    }
    return v;
  }
  function sum() {
    let v = product();
    while (peek() === '+' || peek() === '-') {
      const op = next(), r = product();
      v = op === '+' ? v + r : v - r;
    }
    return v;
  }
  const v = sum();
  if (i !== tokens.length || !Number.isFinite(v)) throw 0;
  return Math.round(v * 1e10) / 1e10;
}

let expr = '';
const format = (n) => n.toLocaleString('ru-RU', { maximumFractionDigits: 10 });
function show(preview = true) {
  $('#expr').textContent = expr;
  if (!expr) { $('#value').textContent = '0'; return; }
  if (!preview) return;
  try { $('#value').textContent = format(evaluate(expr)); } catch { /* выражение ещё не закончено */ }
}
function press(key) {
  if (key === 'C') expr = '';
  else if (key === '⌫') expr = expr.slice(0, -1);
  else if (key === '=') {
    try {
      const result = evaluate(expr);
      const row = document.createElement('div');
      row.innerHTML = '';
      row.append(expr + ' = ', Object.assign(document.createElement('b'), { textContent: format(result) }));
      row.onclick = () => { expr = String(result); show(); };
      $('#history').prepend(row);
      expr = String(result);
      $('#value').textContent = format(result);
      $('#expr').textContent = '';
      return;
    } catch { $('#value').textContent = 'Ошибка'; return; }
  } else expr += key;
  show();
}
const KEYS = ['C', '(', ')', '÷', '7', '8', '9', '×', '4', '5', '6', '-', '1', '2', '3', '+', '%', '0', '.', '⌫', '='];
for (const k of KEYS) {
  const b = document.createElement('button');
  b.className = 'key' + ('÷×-+%()'.includes(k) ? ' op' : '') + (k === '=' ? ' eq wide' : '') + (k === 'C' ? ' op' : '');
  b.textContent = k;
  b.addEventListener('click', () => press(k));
  $('#keys').append(b);
}
document.addEventListener('keydown', (e) => {
  if (state.app !== 'calc') return;
  const map = { '*': '×', '/': '÷', Enter: '=', '=': '=', Backspace: '⌫', Escape: 'C', ',': '.' };
  const k = map[e.key] || e.key;
  if (KEYS.includes(k) || /^[0-9]$/.test(k)) { e.preventDefault(); press(k); }
});

window.panel = { setState, evaluate };
send('ready');
</script>
</body>
</html>
