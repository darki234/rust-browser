[package]
name = "rust-browser"
version = "0.2.0"
edition = "2021"

[dependencies]
tao = "0.34"
# devtools — инструменты разработчика (F12) и в release-сборке.
wry = { version = "0.53", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# распаковка встроенного uBlock Origin Lite
zip = { version = "2", default-features = false, features = ["deflate"] }
# Прямой доступ к WebView2: горячие клавиши, перехват запросов, загрузки.
webview2-com = "0.38"
windows-future = "0.2"
sha2 = "0.10"
sha1 = "0.10"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security_Cryptography",
    "Win32_System_WinRT",
    "Foundation",
    "Security_Credentials_UI",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
